<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Course Assigned</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .message-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 480px;
        }
        .message-box h1 {
            margin: 0 0 15px;
            font-size: 1.6rem;
            color: #333;
        }
        .message-box p {
            margin: 0;
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="message-box">
        <h1>No course</h1>
        <p>Your account has no assigned course. Please wait for a superadmin to assign one or contact support for help.</p>
    </div>
</body>
</html>
