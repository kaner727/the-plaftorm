{% extends "account/base_auth.html" %}

{% block title %}Change Password - The Platform{% endblock %}

{% block auth_content %}
<h3 class="text-xl font-bold text-slate-800 mb-2 text-center">Change Password</h3>
<p class="text-sm text-slate-500 text-center mb-6">Fill in the fields below to change your current password.</p>

<form class="allauth-form" method="POST" action="{% url 'account_change_password' %}">
    {% csrf_token %}
    
    {{ form }}

    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold p-3 rounded-lg shadow-sm transition mt-4 cursor-pointer">
        Confirm New Password
    </button>
</form>

<div class="mt-6 text-center border-t border-slate-100 pt-4">
    <a href="{% url 'dashboard' %}" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 hover:underline">
        Back to Dashboard
    </a>
</div>
{% endblock %}
