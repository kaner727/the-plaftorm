<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Authentication{% endblock %}</title>
    <!-- Tailwind v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Style the automatically generated Django/Allauth form -->
    <style>
        .allauth-form p { margin-bottom: 1.25rem; }
        .allauth-form label { display: block; font-size: 0.875rem; font-weight: 600; color: #334155; margin-bottom: 0.375rem; }
        .allauth-form input[type="text"], 
        .allauth-form input[type="password"], 
        .allauth-form input[type="email"] {
            width: 100%; padding: 0.625rem 0.875rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; background-color: #f8fafc; outline: none; transition: all 0.2s;
        }
        .allauth-form input:focus { border-color: #4f46e5; background-color: #fff; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
        .allauth-form .errorlist { color: #dc2626; font-size: 0.875rem; margin-bottom: 0.75rem; list-style: none; padding: 0; }
        .allauth-form input[type="checkbox"] { margin-right: 0.5rem; border-radius: 0.25rem; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <!-- Platform logo or name -->
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">The Platform</h2>
            <p class="text-sm text-slate-500 mt-1">Your exclusive members area</p>
        </div>

        <!-- Dynamic page content -->
        {% block auth_content %}{% endblock %}
    </div>

</body>
</html>
