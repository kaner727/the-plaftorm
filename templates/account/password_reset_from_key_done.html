{% extends "account/base_auth.html" %}

{% block title %}Password Changed - The Platform{% endblock %}

{% block auth_content %}
<div class="text-center">
    <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mb-4">
        <svg class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
    </div>

    <h3 class="text-xl font-bold text-slate-800 mb-2">All set!</h3>
    <p class="text-sm text-slate-500 mb-6">
        Your password has been reset successfully. You can now sign in with your new credentials.
    </p>

    <div class="border-t border-slate-100 pt-4">
        <a href="{% url 'account_login' %}" class="w-full inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-semibold p-3 rounded-lg shadow-sm transition text-center">
            Sign In
        </a>
    </div>
</div>
{% endblock %}
