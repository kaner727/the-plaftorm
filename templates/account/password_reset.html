{% extends "account/base_auth.html" %}

{% block title %}Reset Password - The Platform{% endblock %}

{% block auth_content %}
<h3 class="text-xl font-bold text-slate-800 mb-2 text-center">Password recovery</h3>
<p class="text-sm text-slate-500 text-center mb-6">Enter your registered email address and we will send you a link to reset your password.</p>

<form class="allauth-form" method="POST" action="{% url 'account_reset_password' %}">
    {% csrf_token %}
    
    {{ form }}

    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold p-3 rounded-lg shadow-sm transition mt-4 cursor-pointer">
        Send reset link
    </button>
</form>

<div class="mt-6 text-center border-t border-slate-100 pt-4">
    <a href="{% url 'account_login' %}" class="text-sm font-semibold text-indigo-600 hover:text-indigo-500 hover:underline inline-flex items-center gap-1">
        ← Back to Sign In
    </a>
</div>
{% endblock %}
