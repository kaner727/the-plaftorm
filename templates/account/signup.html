{% extends "account/base_auth.html" %}

{% block title %}Create Account - The Platform{% endblock %}

{% block auth_content %}
<h3 class="text-xl font-bold text-slate-800 mb-6 text-center">Create your free account</h3>

<form class="allauth-form" method="POST" action="{% url 'account_signup' %}">
    {% csrf_token %}
    
    {{ form }}

    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold p-3 rounded-lg shadow-sm transition mt-4 cursor-pointer">
        Complete Sign Up
    </button>
</form>

<div class="mt-6 text-center border-t border-slate-100 pt-4">
    <p class="text-sm text-slate-600">
        Already have an account? 
        <a href="{% url 'account_login' %}" class="font-semibold text-indigo-600 hover:text-indigo-500 hover:underline">
            Sign in
        </a>
    </p>
</div>
{% endblock %}
