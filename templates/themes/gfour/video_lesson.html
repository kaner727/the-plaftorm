{% extends base_module %}
{% block lesson_content %}
    <h1>G4 THEME</h1>
    <div class="aspect-video w-full rounded-lg overflow-hidden">
        <iframe 
            src="{{ current_lesson.get_video_url }}"
            class="w-full h-full"
            frameborder="0"
            allowfullscreen
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
        </iframe>
    </div>

    <form method="post" class="mt-8" action="{% url 'complete_lesson' current_lesson.id %}">
        {% csrf_token %}

        <button type="submit" class="btn btn-primary">
            {% if completed %}
                ✓ Completed
            {% else %}
                 Complete Lesson
            {% endif %} 
        </button>
    </form>
    
{% endblock %}
